spring.application.name=farm
springdotenv.directory=server/farm

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:farmcatalog}
spring.datasource.username=${DB_USER:pesho}
spring.datasource.password=${DB_PASSWORD:Password1223!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Configuration (4 hours = 14400000 ms)
jwt.secret=${JWT_SECRET:1.9TDI++}
jwt.expiration-ms=${JWT_EXPIRATION_MS:14400000}

# SpringDoc OpenAPI & Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.display-request-duration=true
